version: '3.8'

################################################################################
# Ollama Suite - Simplified Stack for Knowledge Base
# Optimized for: Claude Pro + DeepSeek-R1 + Local Knowledge Base
# GTX 1060 6GB / Ubuntu 24.04 LTS
#
# NOTE: Your n8n, PostgreSQL, and Redis are already running elsewhere.
# This compose file only includes Qdrant for vector search.
################################################################################

services:
  # ============================================================================
  # Vector Database (Core component for knowledge base)
  # ============================================================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================================================
# Volumes
# ============================================================================

volumes:
  qdrant-data:
    driver: local
    # Your vectors and embeddings will be stored here
    # Estimated size: ~1GB for 1M vectors (768-dim embeddings)

# ============================================================================
# Networks
# ============================================================================

networks:
  default:
    name: ollama-network
    driver: bridge

# ============================================================================
# Usage Instructions
# ============================================================================
#
# Start Qdrant:
#   docker compose up -d qdrant
#
# Stop Qdrant:
#   docker compose down
#
# View logs:
#   docker logs qdrant
#
# Access Qdrant API:
#   http://localhost:6333
#   http://localhost:6333/dashboard  (Web UI)
#
# Create collection (example):
#   curl -X PUT http://localhost:6333/collections/knowledge \
#     -H "Content-Type: application/json" \
#     -d '{
#       "vectors": {
#         "size": 768,
#         "distance": "Cosine"
#       }
#     }'
#
# Integration with n8n:
#   Use HTTP Request node to:
#   1. Generate embeddings with DeepSeek/Ollama
#   2. Store vectors in Qdrant
#   3. Search for similar documents
#
# ============================================================================
