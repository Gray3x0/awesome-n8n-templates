global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ollama-suite'
    environment: 'local'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'nvidia-gpu'
    static_configs:
      - targets: ['nvidia-exporter:9835']

  - job_name: 'ollama-exporter'
    static_configs:
      - targets: ['host.docker.internal:8000']
